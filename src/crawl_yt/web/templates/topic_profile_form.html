{% extends "base.html" %}
{% block content %}
<h1>{{ title }}</h1><form class="profile-form" method="post" action="{{ '/topic-profiles/' ~ profile.id if profile else '/topic-profiles' }}"><label>Name <input name="name" value="{{ profile.name if profile else '' }}" required></label><label>Description <textarea name="description" rows="4">{{ profile.description if profile else '' }}</textarea></label><label>Candidate-finding terms <textarea name="search_concepts" rows="8">{{ profile.search_concepts|join('\n') if profile else '' }}</textarea><small>One search term per line. These find candidate channels.</small></label><label>Verification terms <textarea name="concept_phrases" rows="14" required>{{ profile.concept_phrases|join('\n') if profile else '' }}</textarea><small>One phrase per line. These verify candidate channels.</small></label><button>{{ 'Save changes' if profile else 'Create profile' }}</button></form>
{% endblock %}
