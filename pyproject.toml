[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crawl-yt"
version = "0.1.0"
description = "YouTube channel discovery MVP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "yt-dlp>=2026.7.4",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
asr = ["faster-whisper>=1.1"]
test = ["httpx>=0.27"]

[project.scripts]
crawl-yt = "crawl_yt.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
