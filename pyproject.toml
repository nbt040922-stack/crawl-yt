[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crawl-yt"
version = "0.1.0"
description = "YouTube channel discovery MVP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["yt-dlp>=2026.7.4"]

[project.scripts]
crawl-yt = "crawl_yt.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
